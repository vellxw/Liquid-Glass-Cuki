name: Local Glass native drag Android
on:
  pull_request:
    paths:
      - 'src/liquid/**'
      - 'src/home/**'
      - 'examples/RegisterPhysicsLab.tsx'
      - 'App.tsx'
      - 'package.json'
      - 'qa/liquid/**'
      - '.github/workflows/liquid-native.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-go:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: python -m pip install pillow
      - name: Enable KVM for the runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash qa/liquid/android-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-glass-native-android
          path: qa/liquid/native-output/
          retention-days: 14
