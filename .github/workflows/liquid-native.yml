name: Local Glass native drag Android
on:
  pull_request:
    paths:
      - 'src/liquid/**'
      - 'src/home/**'
      - 'examples/RegisterPhysicsLab.tsx'
      - 'App.tsx'
      - 'package.json'
      - 'qa/liquid/**'
      - 'qa/performance/**'
      - 'examples/GlassPerformanceBench.tsx'
      - '.github/workflows/liquid-native.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-go:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: node qa/liquid/overlay-check.cjs
      - run: python -m pip install pillow perfetto
      - name: Enable KVM for the runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-metrics
          script: |
            bash qa/liquid/android-smoke.sh
            python qa/liquid/validate-locality.py
            python qa/liquid/strict-rest.py
      - name: Archive the exact tested source
        if: always()
        run: |
          mkdir -p qa/liquid/native-output
          git archive --format=zip --prefix=CUKI-Registrar-Lab/ -o qa/liquid/native-output/CUKI-Registrar-Lab-source.zip HEAD
          git rev-parse HEAD > qa/liquid/native-output/source-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-glass-native-android
          path: qa/liquid/native-output/
          retention-days: 14
