name: Expo checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx expo install --check
      - run: npm run typecheck
      - run: npm run check
      - run: node qa/register/check.cjs
      - run: npm run check:liquid
      - run: node qa/liquid/pipeline-check.cjs
      - run: node qa/liquid/overlay-check.cjs
      - run: node qa/performance/check.cjs
      - run: node qa/premium/check.cjs
      - run: node qa/face/check.cjs
      - run: python -m unittest discover -s qa/performance -p 'test_*.py' -v
      - run: npm run export:android
      - run: npm run export:ios
