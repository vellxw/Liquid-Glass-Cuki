name: Expo checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx expo install --check
      - run: npm run typecheck
      - run: npm run check
      - run: npm run check:register
      - run: npm run check:button
      - run: npm run export:android
      - run: npm run export:ios
      - name: Archive exact tested inputs
        if: always()
        run: |
          mkdir -p qa/button/output
          git archive --format=zip --prefix=Liquid-Glass-Cuki/ -o qa/button/output/source.zip HEAD
          cp package-lock.json qa/button/output/installed-package-lock.json || true
          git rev-parse HEAD > qa/button/output/source-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: standard-button-checks
          path: qa/button/output/
          retention-days: 14
