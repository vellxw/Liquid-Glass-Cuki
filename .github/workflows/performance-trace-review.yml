name: Inspect retained release Perfetto trace
on:
  pull_request:
    paths:
      - '.github/workflows/performance-trace-review.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - run: python -m pip install perfetto
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 35033703181
          name: registrar-release-performance
          path: qa/liquid/native-output
      - name: Correct package filter, keeping original data untouched
        run: |
          cp qa/liquid/native-output/performance/trace-report.json qa/liquid/native-output/performance/original-filter-report.json
          python - <<'PY'
          from pathlib import Path
          p=Path('qa/performance/trace-report.py')
          s=p.read_text().replace('host.exp.exponent','com.vellxw.liquidglasscuki')
          Path('/tmp/cuki-retained-trace.py').write_text(s)
          PY
          python /tmp/cuki-retained-trace.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: corrected-release-trace-analysis
          path: |
            qa/liquid/native-output/performance/trace-report.json
            qa/liquid/native-output/performance/original-filter-report.json
            qa/liquid/native-output/performance/trace-report-error.txt
            qa/liquid/native-output/performance/trace-analysis.log
          retention-days: 14
